<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="創作に使える、かわいいAIお題メーカー。">
  <title>きょうの、ひらめき。｜AIお題メーカー</title>
  <style>
    :root { --ink:#52384c; --sub:#896d80; --paper:#fff9fb; --card:rgba(255,255,255,.76); --line:#efdce5; --main:#d87a9c; --a:#ffd9e7; --b:#dceeff; --button:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; min-height:100vh; display:grid; place-items:center; padding:22px 14px; color:var(--ink); background:radial-gradient(circle at 8% 7%,var(--b),transparent 29rem),radial-gradient(circle at 92% 90%,var(--a),transparent 30rem),var(--paper); font-family: ui-rounded, "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif; }
    main { width:min(100%,680px); text-align:center; }
    .hero { padding:26px 18px 22px; border-radius:28px; background:linear-gradient(135deg,var(--a),var(--b)); box-shadow:0 12px 35px rgba(121,81,110,.12); }
    .spark { letter-spacing:.35em; font-size:18px; color:var(--sub); }
    h1 { margin:7px 0 3px; font-size:clamp(27px,6vw,42px); font-weight:500; }
    .lead { margin:0; color:var(--sub); }
    .modes { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:18px 0 12px; }
    button { font:inherit; color:inherit; cursor:pointer; }
    .mode, .copy, .theme, .generate { border:1px solid var(--line); background:var(--button); border-radius:16px; transition:transform .15s ease, box-shadow .15s ease, background .15s ease; }
    .mode { min-height:75px; padding:8px 5px; font-size:13px; }
    .mode span { display:block; margin-bottom:3px; font-size:22px; }
    .mode[aria-pressed="true"] { border-color:var(--main); background:color-mix(in srgb,var(--main) 13%, white); box-shadow:0 5px 13px rgba(183,89,126,.15); }
    .prompt { min-height:205px; display:grid; place-items:center; padding:28px 24px; border:1px solid rgba(255,255,255,.8); border-radius:28px; background:var(--card); box-shadow:0 12px 35px rgba(121,81,110,.1); }
    .label { margin-bottom:10px; color:var(--sub); font-size:14px; }
    #prompt { font-size:clamp(22px,4.5vw,33px); line-height:1.45; font-weight:500; text-wrap:balance; }
    .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:9px; margin:13px 0 16px; }
    .generate { padding:13px 21px; border-color:var(--main); background:var(--main); color:white; font-weight:500; box-shadow:0 6px 17px rgba(183,89,126,.2); }
    .copy { padding:13px 18px; }
    button:hover { transform:translateY(-2px); }
    button:focus-visible { outline:3px solid var(--main); outline-offset:3px; }
    .dresser { display:flex; align-items:center; justify-content:center; gap:9px; color:var(--sub); font-size:13px; }
    .theme { width:29px; height:29px; border-radius:50%; padding:0; }
    .theme[data-theme="sugar"] { background:linear-gradient(135deg,#ffd0e2,#bce5ff); }
    .theme[data-theme="night"] { background:linear-gradient(135deg,#42346d,#ba91d1); }
    .theme[data-theme="citrus"] { background:linear-gradient(135deg,#ffe077,#a7df9d); }
    #notice { min-height:1.4em; margin:9px 0 0; color:var(--sub); font-size:13px; }
    footer { margin-top:25px; color:var(--sub); font-size:12px; }
    body.night { --ink:#f9f0ff; --sub:#e0c9e8; --paper:#201a35; --card:rgba(61,48,91,.75); --line:#6d5a8b; --main:#c891dc; --a:#403064; --b:#6f4f82; --button:#332a52; }
    body.citrus { --ink:#425139; --sub:#6b7e62; --paper:#fffdf3; --card:rgba(255,255,255,.78); --line:#e8dcae; --main:#7eab72; --a:#ffe68a; --b:#bce3a8; --button:#fffef9; }
    @media (max-width:430px) { .modes { grid-template-columns:repeat(2,1fr); } .hero { border-radius:23px; } .prompt { min-height:190px; border-radius:23px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; } }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <div class="spark" aria-hidden="true">✦ ♡ ✦</div>
      <h1>きょうの、ひらめき。</h1>
      <p class="lead">AI創作お題メーカー</p>
    </header>
    <section aria-label="お題メーカー">
      <div class="modes" role="group" aria-label="お題のタイプ">
        <button class="mode" type="button" data-mode="words" aria-pressed="true"><span>✧</span>単語3つ</button>
        <button class="mode" type="button" data-mode="title" aria-pressed="false"><span>✎</span>タイトル</button>
        <button class="mode" type="button" data-mode="emoji" aria-pressed="false"><span>☻</span>絵文字3つ</button>
        <button class="mode" type="button" data-mode="scene" aria-pressed="false"><span>☾</span>ひとこと</button>
      </div>
      <div class="prompt" aria-live="polite">
        <div><div class="label" id="label">単語だけを3つ、ぶつけよう</div><div id="prompt">映画館 × ホッチキス × ゾンビ</div></div>
      </div>
      <div class="actions"><button class="generate" type="button" id="generate">お題を引く　✦</button><button class="copy" type="button" id="copy">コピー</button></div>
      <div class="dresser" role="group" aria-label="着せ替えテーマ"><span>きせかえ</span><button class="theme" data-theme="sugar" aria-label="シュガー"></button><button class="theme" data-theme="night" aria-label="ミッドナイト"></button><button class="theme" data-theme="citrus" aria-label="シトラス"></button></div>
      <p id="notice" aria-live="polite"></p>
    </section>
    <footer>創作のおともに。よいひらめきを ♡</footer>
  </main>
  <script>
    const wordA=['映画館','ホスト','町','コンビニ','校長','病院','駐車場','刑事','地下室','教室','屋上','旅館','税関','神社','団地','工場','厨房','温泉','監視塔','駅員','劇場','遊園地','コンテナ','墓地','体育館','研究所','市場','交番','海賊','美容室','電車','庭師','山小屋','図書館','保健室','水槽','バー','警備員','廃墟','砂漠','ラジオ局','銭湯','台所','宇宙船','役所','水族館','倉庫','診察室'];
    const wordB=['ホッチキス','キーホルダー','スリッパ','洗濯機','レシート','マネキン','ドローン','冷蔵庫','着ぐるみ','非常口','プリンター','ラジカセ','電子レンジ','消火器','USB','ガムテープ','ソファ','体温計','カセット','エレベーター','ヘルメット','目覚まし','ロッカー','炊飯器','虫眼鏡','洗面器','段ボール','掃除機','インターホン','コインロッカー','自動販売機','石鹸','リモコン','フォーク','バケツ','枕','包丁','改札','電球','ドアノブ','シャンプー','チャック','標識','レントゲン','バス停','エアコン','シャベル','マイク'];
    const wordC=['ゾンビ','河童','バグ','宇宙人','呪い','偽物','事故物件','脱走','寝不足','停電','悪夢','借金','うわさ','迷子','隕石','試験','冗談','休日','葬式','二日酔い','くしゃみ','留守番','不具合','口実','秘密','警報','変身','予言','寝言','雨漏り','反省文','偽名','盗聴','居眠り','忘れ物','残業','非常識','逆再生','失踪','誤作動','紙吹雪','落書き','昼寝','裏切り','欠勤','停車','湿気','あくび'];
    const titleThings=['保健室','パスワード','冷蔵庫','事故物件','観覧車','着ぐるみ','夜勤','自動販売機','葬儀屋','部長','幽霊','レシート','空き瓶','停電','集合写真','エレベーター','タクシー','監視カメラ','ロッカー','山奥','リモコン','金魚','転校生','地下鉄','偽名','宇宙人','校庭','宅配便','砂時計','バス停','ガム','怪獣','庭師','ラジオ','廃ホテル','防犯ブザー'];
    const titleStates=['失踪','偽物','寝不足','偽装','逆再生','誤作動','反省会','大渋滞','家出','停電','口止め','密談','予行演習','置き去り','居眠り','無断欠席','大掃除','誤配','変身','雨漏り','留守番','偽証','終電','不在票','悪夢','隠し事','謎解き','忘れ物','初期不良','連絡網','再放送','落書き','騒音','不具合','大遅刻','見間違い'];
    const titleVerbs=['踊らない','眠れない','嘘をつく','帰ってこない','急に増える','勝手に歌う','月へ行く','人間をやめる','返事をしない','消えたふりをする','屋上にいる','遅刻し続ける','名前を変える','ドアを開けない','だれかを待つ','夢に出てくる','笑いすぎる','空を飛べない','全部知っている','雨を嫌う','鍵をなくす','一度だけ泣く','朝を食べる','地下へ潜る'];
    const emojis=['🪼','🫧','🕯️','🍓','🎠','🌙','🦋','🗝️','📮','🐈‍⬛','☔','💌','🦢','🎀','🪞','🌻','🚲','🪽','🧸','🍬','🎧','🪐','🫖','🪻','🧁','🎐','🧩','🧚','🍒','📚','🦜','🪄','🌂','🛼','🐚','🪴','🪲','🪰','🪳','🦠','🧫','🧬','🫀','🦷','🦴','👁️','🧠','🫁','🪤','🪠','🧯','🛎️','🗜️','🪚','🧲','🧷','🧻','🪣','🪑','🪜','🛗','🧳','🪫','🔋','📼','☎️','📟','🪪','🪪','⚗️','🧪','🧿','🪬','🗿','🪆','🎰','🪩','🪃','🛸','🛰️','🛹','🛞','🚧','🚨','⚰️','🗑️','🧼','🪥','🧽','🪒','🪤','🧱','🪨','🕳️','🌡️','🪫','🧃','🦤','🦭','🦞','🪼','🫎','🦠'];
    const scenePlaces=['誰もいない夜の水族館で','終電後のファミレスで','雨漏りする校舎で','立入禁止の屋上で','深夜のサービスエリアで','廃ホテルのロビーで','真夏の葬儀場で','閉店後のホームセンターで','地下鉄の終点で','霧の濃い駐車場で','町はずれのコインランドリーで','雪の日のコンビニで','空っぽの体育館で','午前四時の病院で','水没しかけた地下街で','古い団地の廊下で','蛍光灯だけの研究所で','花火大会の翌朝で','雨雲の中の電車で','壊れた観覧車の下で','月面の給湯室で','海底の交番で','雲の上の駐車場で','砂漠の自動販売機の前で','工場の休憩室で','知らない町の駅前で'];
    const characters=['制服の少女が','夜勤明けの看護師が','着ぐるみの人が','幽霊になりたての会社員が','小学生の探偵が','寝不足の宇宙人が','二日酔いの魔女が','迷子のロボットが','無口な配達員が','三日前からいる猫が','元アイドルの警備員が','透明な転校生が','失業中の天使が','ベテランの怪獣が','顔を隠した庭師が','タクシー運転手が','卒業できない高校生が','壊れかけの人形が','不機嫌な人魚が','記憶喪失の刑事が','見習いの死神が','未来から来た清掃員が','泣かないピエロが','月を知らない子どもが','留守番中の王様が','風邪をひいたドラゴンが'];
    const actions=['自分の指名手配書を見つけた。','ずっと同じ留守電を聞いている。','本物の自分を探している。','だれもいない相手に謝っている。','壊れた自動販売機に話しかけている。','明日の天気を捨てようとしている。','知らない名前で呼ばれている。','誰かの夢から脱出できない。','財布の中に小さな海を飼っている。','町の秘密をうっかり放送してしまった。','自分の影と口げんかしている。','昨日の自分を尾行している。','使えない魔法だけを練習している。','冷蔵庫の中から助けを呼んでいる。','一度も会ったことのない友だちを待っている。','最終バスを一台だけ見送った。','月を返品しようとしている。','自分だけが読める落書きを見つけた。','町じゅうの時計を止めてしまった。','知らない鍵をポケットに入れている。','名前のない動物に餌をあげている。','空っぽの棺に花を入れている。','午前零時だけ人間に戻る。','だれかの人生を間違えて受け取った。','笑うたびに部屋が一つ増える。','雨の正体を知ってしまった。'];
    const history={words:[],title:[],emoji:[],scene:[]};
    const prompt=document.getElementById('prompt'), label=document.getElementById('label'), notice=document.getElementById('notice');
    let mode='words';
    const pick=list=>list[Math.floor(Math.random()*list.length)];
    function unique(modeName,make){ let value,tries=0; do { value=make(); tries++; } while(history[modeName].includes(value)&&tries<80); history[modeName].push(value); if(history[modeName].length>40)history[modeName].shift(); return value; }
    function makePrompt(){
      if(mode==='words') return unique(mode,()=>`${pick(wordA)} × ${pick(wordB)} × ${pick(wordC)}`);
      if(mode==='title') return unique(mode,()=>{
        const thing=pick(titleThings), state=pick(titleStates), verb=pick(titleVerbs);
        return pick([
          `「${thing}は${verb}」`,
          `「${thing}の${state}」`,
          `「${state}の${thing}が${verb}」`,
          `「${thing}、${state}、そして${verb}」`,
          `「${thing}を見たら${verb}」`,
          `「${state}になった${thing}」`
        ]);
      });
      if(mode==='emoji') return unique(mode,()=>{ const first=pick(emojis); let second=pick(emojis),third=pick(emojis); while(second===first)second=pick(emojis); while(third===first||third===second)third=pick(emojis); return `${first}　${second}　${third}`; });
      return unique(mode,()=>`${pick(scenePlaces)}、${pick(characters)}${pick(actions)}`);
    }
    function draw(){ const labels={words:'単語だけを3つ、ぶつけよう',title:'一枚絵のタイトルから描こう',emoji:'この3つを全部入れてみよう',scene:'空気感からはじめよう'}; label.textContent=labels[mode]; prompt.textContent=makePrompt(); notice.textContent=''; }
    document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw();}));
    document.getElementById('generate').addEventListener('click',draw);
    document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(prompt.textContent);notice.textContent='コピーしました ♡';}catch{notice.textContent='コピーして使ってね：'+prompt.textContent;}});
    document.querySelectorAll('.theme').forEach(b=>b.addEventListener('click',()=>{document.body.className=b.dataset.theme==='sugar'?'':b.dataset.theme;}));
  </script>
</body>
</html>
